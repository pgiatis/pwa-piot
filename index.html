<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyPool.AI — Dashboard v4</title>
<meta name="theme-color" content="#0b1220"/>
<link rel="manifest" href="manifest_fixed.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
  :root{
    --bg:#091427;
    --panel:#0d1c34;
    --card:#11223e;
    --text:#e7edf7;
    --muted:#9fb0c9;
    --blue:#2b84ff;
    --green:#2cd186;
    --border:#1e2f4c;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#0e2142 0%,var(--bg) 40%);min-height:100vh}
  .app{max-width:1100px;margin:18px auto;padding:16px}
  header{background:linear-gradient(145deg,#0f2347,#0b1a36);border:1px solid var(--border);border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:12px}
  h1{margin:0;font-weight:800;letter-spacing:.3px}
  .status{display:flex;align-items:center;gap:10px}
  .dot{width:11px;height:11px;border-radius:50%;background:#7a8699}
  .panel{background:linear-gradient(145deg,var(--panel),#0a182f);border:1px solid var(--border);border-radius:16px;padding:14px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:980px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{background:linear-gradient(145deg,var(--card),#10203a);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .title{font-size:12px;color:var(--muted)}
  .value{font-size:24px;font-weight:900;display:flex;align-items:center;gap:6px}
  .value.blue{color:#67a5ff}
  .flame{display:none;align-items:center;gap:6px;color:#ff8c00;font-weight:bold;animation:flamePulse 1.5s infinite ease-in-out;text-shadow:0 0 4px rgba(255,140,0,0.6);}
  .flame span{font-size:13px;color:#ffb84d;font-weight:600}
  @keyframes flamePulse{0%,100%{opacity:1;text-shadow:0 0 4px rgba(255,140,0,0.5);}50%{opacity:.85;text-shadow:0 0 12px rgba(255,140,0,0.9);}}
  .setpoint{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .arrowbtn{background:#20345a;border:none;border-radius:50%;width:28px;height:28px;color:white;font-weight:bold;font-size:14px;cursor:pointer}
  .arrowbtn:hover{background:#2b84ff}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pill{border-radius:16px;border:1px solid var(--border);background:linear-gradient(145deg,#172b4f,#0d1f3f);color:var(--text);padding:18px 14px;text-align:center;cursor:pointer;font-weight:800;transition:background .2s}
  .pill .small{display:block;margin-top:6px;font-size:12px;color:white;font-weight:600}
  .pill.on{background:var(--green);color:white}
  .schedule-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .histogram-panel{height:58vh;min-height:320px}
  .histogram-panel canvas{width:100%;height:100%}
  .footer{margin-top:12px;background:#0a162b;border:1px solid var(--border);border-radius:12px;padding:10px;color:#9fb0c9;font-size:12px}
  .btn{appearance:none;border:1px solid #2b84ff55;background:linear-gradient(145deg,#18325f,#0f2347);color:#e7edf7;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700}
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:2000;padding:14px}
  .modal-card{width:min(920px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#0f2347,#0b1830);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .modal-title{font-size:18px;font-weight:900}
  .modal-close{border:none;background:#20345a;color:var(--text);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
  .modal-body{display:grid;gap:12px}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .schedule-list{display:grid;gap:10px}
  .schedule-item{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px}
  .schedule-item .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
  .schedule-item .actions{display:flex;gap:8px;flex-wrap:wrap}
  .editor{border:1px solid var(--border);background:rgba(0,0,0,.18);border-radius:14px;padding:12px}
  .editor.hidden{display:none}
  .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  .field input[type="number"],.field input[type="time"],.field select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:#0e1a31;color:var(--text)}
  .day-row{display:flex;flex-wrap:wrap;gap:10px}
  .day-chip{display:inline-flex;align-items:center;gap:6px;background:#0e1a31;border:1px solid var(--border);padding:8px 10px;border-radius:999px;font-size:12px}
  .state-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .state-row{display:flex;flex-direction:column;gap:6px}
  .state-label{font-size:12px;color:var(--muted)}
  .state-btn{border:none;border-radius:12px;padding:10px 8px;color:#fff;font-weight:800;cursor:pointer}
  .state-btn.on{background:var(--green)}
  .state-btn.off{background:#ff6b6b}
  .state-btn.dc{background:#5e6d88}
  .empty-state{color:var(--muted);font-size:13px;padding:8px 2px}
  .install-help{font-size:14px;line-height:1.5;color:var(--text)}
  .install-help ol{margin:8px 0 0 20px;padding:0}
  .hist-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .hist-controls label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .hist-controls .group-title{font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>MyPool.AI</h1></div>
    <div class="status"><span class="dot" id="dot"></span></div>
  </header>

  <div class="panel">
    <div class="cards">
      <div class="card" id="card-water"><div class="title">WATER TEMPERATURE</div><div class="value" id="valWater">—<div class="flame" id="flame"><div>🔥</div><span>Heating</span></div></div></div>
      <div class="card" id="card-set"><div class="title">SET POINT</div><div class="setpoint"><div class="value blue" id="valSet">—</div><div><button class="arrowbtn" id="btnUp">▲</button><button class="arrowbtn" id="btnDown">▼</button></div></div></div>
      <div class="card" id="card-air"><div class="title">AMBIENT AIR</div><div class="value" id="valAir">—</div></div>
      <div class="card" id="card-ctrl"><div class="title">CONTROLLER TEMP</div><div class="value" id="valCtrl">—</div></div>
      <div class="card" id="card-lux"><div class="title">LIGHT LEVEL</div><div class="value" id="valLux">—</div></div>
      <div class="card" id="card-mode"><div class="title">CURRENT MODE</div><div class="value" id="valMode" style="cursor:pointer;text-decoration:underline">—</div></div>
    </div>

    <div style="margin:14px 0 8px;color:#9fb0c9;font-weight:700;">Circuits</div>
    <div class="controls" id="controls"></div>

      <div class="schedule-tools">
        <button id="btnScheduleOpen" class="btn">View / Edit Schedule</button>
        <button id="btnHeaterScheduleOpen" class="btn">Heater Schedule Settings</button>
        <button id="btnScheduleLogsOpen" class="btn">Schedule Event Logs</button>
        <button id="btnHistogramOpen" class="btn">Histogram</button>
        <button id="btnInstallApp" class="btn">Add To Phone Home Screen</button>
      </div>

  </div>

  <div class="footer" id="foot">Disconnected</div>
</div>

  <div class="modal" id="schedule-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Schedule Editor</div>
        <button class="modal-close" id="schedule-modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <div id="schedule-editor" class="editor hidden"></div>
        <div class="modal-actions">
          <button id="schedule-add-btn" class="btn">Add Entry</button>
          <button id="schedule-refresh-btn" class="btn">Refresh</button>
        </div>
        <div id="schedule-list" class="schedule-list"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="heater-schedule-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Heater Schedule Settings</div>
        <button class="modal-close" id="heater-schedule-modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <div id="heater-schedule-editor" class="editor hidden"></div>
        <div class="modal-actions">
          <button id="heater-schedule-add-btn" class="btn">Add Entry</button>
          <button id="heater-schedule-refresh-btn" class="btn">Refresh</button>
        </div>
        <div id="heater-schedule-list" class="schedule-list"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="histogram-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Histogram (Last 24 Hours)</div>
        <button class="modal-close" id="histogram-modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-actions">
          <button id="histogram-refresh-btn" class="btn">Refresh</button>
          <div class="hist-controls">
            <label><input type="checkbox" id="hist-all-on"> All On</label>
            <label><input type="checkbox" id="hist-all-off"> All Off</label>
            <span class="group-title">Refresh:</span>
            <label><input type="checkbox" id="hist-int-5s"> 5 Seconds</label>
            <label><input type="checkbox" id="hist-int-10s"> 10 Seconds</label>
            <label><input type="checkbox" id="hist-int-30s"> 30 Seconds</label>
            <label><input type="checkbox" id="hist-int-60s"> 1 Minute</label>
          </div>
        </div>
        <div class="histogram-panel">
          <canvas id="histogram-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="schedule-log-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Scheduled Mode Event Logs (Last 24 Hours)</div>
        <button class="modal-close" id="schedule-log-modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <div id="schedule-log-list" class="schedule-list"></div>
        <div class="modal-actions">
          <button id="schedule-log-refresh-btn" class="btn">Refresh</button>
          <button id="schedule-log-clear-btn" class="btn">Clear Logs</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="install-help-modal">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">Add MyPool.AI To Home Screen</div>
        <button class="modal-close" id="install-help-modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <div id="install-help-text" class="install-help"></div>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const dot=$('#dot');const foot=$('#foot');const controlsEl=$('#controls');const flame=$('#flame');
function setDot(c){dot.style.background=c;}function setFoot(m){foot.textContent=m;}
function formatF(v){if(v==null||v==='')return'—';const n=Number(v);if(Number.isFinite(n))return n.toFixed(1)+'°F';return String(v);}
function formatLux(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(0)+' lx':'—';}
function formatW(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(1)+' W':'0.0 W';}
function escapeHtml(value){return String(value ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}

const DAY_BITS=[1,2,4,8,16,32,64];
const DAY_LABELS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let scheduleEditorActions=[0,0,0,0];
let heaterScheduleEditorOpen=false;
let histogramChart=null;
let histogramPoints=[];
let lastHistogramSampleMs=0;
let histogramKey='mypool-hist';
const HISTOGRAM_WINDOW_MS=24*60*60*1000;
const HISTOGRAM_SAMPLE_MS=60*1000;
const HISTOGRAM_REFRESH_MS=30*1000;
let histogramRefreshMs=HISTOGRAM_REFRESH_MS;
let histogramRefreshTimer=null;
let histogramModalOpen=false;
let pendingHistogramEvents=[];
let lastKnownUptimeSec=null;
let hasConnectedOnce=false;
let deferredInstallPrompt=null;
let latestTelemetry={
  power:[null,null,null,null],
  state:[null,null,null,null],
  water:null,
  air:null,
  ctrl:null,
  lux:null,
  heater:null,
  uptimeSec:null
};

function histogramAlias(index1to4){
  return (circuitAliases.get(index1to4) || circuitAliases.get(index1to4 - 1) || `Circuit ${index1to4}`);
}

function histogramAliasGroups(){
  const groups = [];
  const byKey = new Map();
  for (let i = 1; i <= 4; i++) {
    const raw = String(histogramAlias(i) || '').trim();
    const label = raw || `Circuit ${i}`;
    const key = label.toLowerCase();
    if (!byKey.has(key)) {
      byKey.set(key, { label, indices: [] });
      groups.push(byKey.get(key));
    }
    byKey.get(key).indices.push(i);
  }
  return groups;
}
function addHistogramEvent(label){
  if (!label) return;
  pendingHistogramEvents.push(label);
  sampleHistogram(true);
}

function toBinaryState(value){
  const n = Number(value);
  return Number.isFinite(n) ? (n > 0 ? 1 : 0) : null;
}

function historyNowMs(){ return Date.now(); }
function trimHistogramPoints(){
  const cutoff = historyNowMs() - HISTOGRAM_WINDOW_MS;
  histogramPoints = histogramPoints.filter(p => p.ts >= cutoff);
  if (histogramPoints.length > 1445) {
    histogramPoints = histogramPoints.slice(histogramPoints.length - 1445);
  }
}
function loadHistogramPoints(){
  try {
    const raw = localStorage.getItem(histogramKey);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) {
      histogramPoints = parsed;
      trimHistogramPoints();
    }
  } catch (_) {}
}
function saveHistogramPoints(){
  try { localStorage.setItem(histogramKey, JSON.stringify(histogramPoints)); } catch (_) {}
}
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : null; }
function sampleHistogram(force=false){
  const now = historyNowMs();
  if (!force && (now - lastHistogramSampleMs) < HISTOGRAM_SAMPLE_MS) return;
  lastHistogramSampleMs = now;
  const evt = pendingHistogramEvents.length ? pendingHistogramEvents.join(' | ') : null;
  pendingHistogramEvents = [];
  histogramPoints.push({
    ts: now,
    p1: toNum(latestTelemetry.power[0]),
    p2: toNum(latestTelemetry.power[1]),
    p3: toNum(latestTelemetry.power[2]),
    p4: toNum(latestTelemetry.power[3]),
    s1: toNum(latestTelemetry.state[0]),
    s2: toNum(latestTelemetry.state[1]),
    s3: toNum(latestTelemetry.state[2]),
    s4: toNum(latestTelemetry.state[3]),
    water: toNum(latestTelemetry.water),
    air: toNum(latestTelemetry.air),
    ctrl: toNum(latestTelemetry.ctrl),
    lux: toNum(latestTelemetry.lux),
    heater: toNum(latestTelemetry.heater),
    evt: evt
  });
  trimHistogramPoints();
  if (histogramPoints.length % 5 === 0 || force) saveHistogramPoints();
}
function histogramLabels(points){
  return points.map(p => {
    const d = new Date(p.ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  });
}
function ensureHistogramChart(){
  const canvas = document.getElementById('histogram-chart');
  if (!canvas || !window.Chart) return null;
  if (histogramChart) return histogramChart;
  histogramChart = new Chart(canvas, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { labels: { color: '#dbe7ff', usePointStyle: true, pointStyle: 'rect' } },
        title: { display: false },
        tooltip: {
          callbacks: {
            afterLabel: (ctx) => {
              const row = histogramPoints[ctx.dataIndex];
              if (row && row.evt) return `Event: ${row.evt}`;
              return '';
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#9fb0c9', maxTicksLimit: 12 }, grid: { color: 'rgba(159,176,201,0.18)' } },
        yPower: { type: 'linear', position: 'left', title: { display: true, text: 'Power (W)', color: '#90caf9' }, ticks: { color: '#90caf9' }, grid: { color: 'rgba(159,176,201,0.18)' } },
        yTemp: { type: 'linear', position: 'right', title: { display: true, text: 'Temp (F)', color: '#ffcc80' }, ticks: { color: '#ffcc80' }, grid: { drawOnChartArea: false } },
        yLux: { type: 'linear', position: 'right', offset: true, title: { display: true, text: 'Lux', color: '#c5e1a5' }, ticks: { color: '#c5e1a5' }, grid: { drawOnChartArea: false } },
        yState: { type: 'linear', position: 'left', offset: true, min: -0.2, max: 1.3, title: { display: true, text: 'State (On/Off)', color: '#ef9a9a' }, ticks: { color: '#ef9a9a', stepSize: 1, callback: (value) => (Number(value) === 0 ? 'Off' : (Number(value) === 1 ? 'On' : '')) }, grid: { drawOnChartArea: false } },
        yHeater: { type: 'linear', position: 'left', offset: true, min: -0.2, max: 1.3, display: false }
      }
    }
  });
  return histogramChart;
}

async function fetchUptimeAndDetectReboot(){
  try {
    const resp = await fetch('/api/sysinfo');
    if (!resp.ok) return;
    const info = await resp.json();
    const up = Number(info.uptime_sec);
    if (!Number.isFinite(up)) return;
    latestTelemetry.uptimeSec = up;
    if (lastKnownUptimeSec !== null && up + 5 < lastKnownUptimeSec) {
      addHistogramEvent('Reboot');
    }
    lastKnownUptimeSec = up;
  } catch (_) {}
}

function renderHistogram(){
  sampleHistogram(true);
  const chart = ensureHistogramChart();
  if (!chart) return;
  const points = histogramPoints.slice();
  const labels = histogramLabels(points);
  const ds = (data, label, color, axis, stepped=false) => ({ label, data, borderColor: color, backgroundColor: color, pointRadius: 0, borderWidth: 1.7, tension: 0.22, yAxisID: axis, spanGaps: true, stepped, pointStyle: 'rect' });
  const groups = histogramAliasGroups();
  const powerPalette = ['#4fc3f7', '#29b6f6', '#03a9f4', '#0288d1'];
  const statePalette = ['#81d4fa', '#4dd0e1', '#26c6da', '#00bcd4'];
  const groupedPower = groups.map((g) => {
    return points.map((p) => {
      let sum = 0;
      let hasAny = false;
      for (const idx of g.indices) {
        const v = toNum(p[`p${idx}`]);
        if (v !== null) {
          sum += v;
          hasAny = true;
        }
      }
      return hasAny ? sum : null;
    });
  });
  const groupedState = groups.map((g) => {
    return points.map((p) => {
      let maxState = null;
      for (const idx of g.indices) {
        const v = toBinaryState(p[`s${idx}`]);
        if (v !== null) {
          maxState = (maxState === null) ? v : Math.max(maxState, v);
        }
      }
      return maxState;
    });
  });
  const eventData = points.map(p => p.evt ? 1.2 : null);
  const datasets = [];
  for (let i = 0; i < groups.length; i++) {
    datasets.push(ds(groupedPower[i], `${groups[i].label} W`, powerPalette[i % powerPalette.length], 'yPower'));
  }
  for (let i = 0; i < groups.length; i++) {
    datasets.push(ds(groupedState[i], `${groups[i].label} On/Off`, statePalette[i % statePalette.length], 'yState', true));
  }
  chart.data.labels = labels;
  datasets.push(ds(points.map(p => p.water), 'Water Temp', '#ffb74d', 'yTemp'));
  datasets.push(ds(points.map(p => p.air), 'Ambient Air', '#81c784', 'yTemp'));
  datasets.push(ds(points.map(p => p.ctrl), 'Controller Temp', '#ba68c8', 'yTemp'));
  datasets.push(ds(points.map(p => p.lux), 'Light Level', '#cddc39', 'yLux'));
  datasets.push(ds(points.map(p => toBinaryState(p.heater)), 'Heater On/Off', '#ef5350', 'yState', true));
  datasets.push({ label: 'Restart', data: eventData, type: 'line', stepped: true, showLine: false, pointRadius: 4, pointHoverRadius: 5, pointStyle: 'rect', borderWidth: 0, borderColor: '#ffffff', backgroundColor: '#ffffff', yAxisID: 'yState', spanGaps: true });
  chart.data.datasets = datasets;
  chart.update('none');
  syncHistogramVisibilityCheckboxes();
}

function syncHistogramVisibilityCheckboxes(){
  const allOn = document.getElementById('hist-all-on');
  const allOff = document.getElementById('hist-all-off');
  if (!allOn || !allOff || !histogramChart) return;
  const target = histogramChart.data.datasets.filter(ds => ds.label !== 'Restart');
  const allVisible = target.length > 0 && target.every(ds => ds.hidden !== true);
  const anyVisible = target.some(ds => ds.hidden !== true);
  allOn.checked = allVisible;
  allOff.checked = !anyVisible;
}

function setAllHistogramDatasetsVisible(visible){
  const chart = ensureHistogramChart();
  if (!chart) return;
  chart.data.datasets.forEach(ds => {
    if (ds.label === 'Restart') return;
    ds.hidden = !visible;
  });
  chart.update('none');
  syncHistogramVisibilityCheckboxes();
}

function syncHistogramIntervalCheckboxes(){
  const byId = {
    'hist-int-5s': 5000,
    'hist-int-10s': 10000,
    'hist-int-30s': 30000,
    'hist-int-60s': 60000
  };
  Object.keys(byId).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.checked = (histogramRefreshMs === byId[id]);
  });
}

function setHistogramRefreshInterval(ms){

  const [stopHour, stopMinute] = stop.split(':').map(v => Number(v));

  if(stopTotal <= targetTotal){ alert('Hold Until must be after Ready By'); return; }
  const payload = { days, target_temp: targetTemp, target_hour: targetHour, target_minute: targetMinute, stop_hour: stopHour, stop_minute: stopMinute };
  if (Number.isInteger(index)) payload.index = index;

    const next=grp.anyOn?1:0;
    for(const idx of grp.circuits){
      client?.publish(`${MAC}/control/set_circuit`,`${idx}:${next}`);
    }
  };
  controlsEl.appendChild(btn);
}
function recomputeGroups(){
  aliasGroups.clear();
  for(const[idx,alias]of circuitAliases){
    const key=alias||`Circuit ${idx}`;
    if(!aliasGroups.has(key))aliasGroups.set(key,{circuits:new Set(),anyOn:false});
    aliasGroups.get(key).circuits.add(idx);
  }
  for(const[,grp]of aliasGroups){grp.anyOn=[...grp.circuits].some(i=>(Number(circuitStatus.get(i))||0)===1);}
  for(const[alias]of aliasGroups){ensureButton(alias);updateButton(alias);}
}
let setTemp=0;let modeState=0;
function modeName(v){
  if(v===0) return 'Off';
  if(v===1) return 'Continuous';
  if(v===2) return 'Scheduled';
  if(v===3) return 'Scheduled AI';
  return 'Unknown';
}
function onMsg(topic,payloadBuf){
  if(!topic.startsWith(MAC+'/'))return;
  const payload=new TextDecoder().decode(payloadBuf);
  if(topic.endsWith('/sensors/water_temperature'))$('#valWater').firstChild.textContent=formatF(payload);
  if(topic.endsWith('/sensors/water_temperature')) latestTelemetry.water = Number(payload);
  else if(topic.endsWith('/sensors/set_temperature')){$('#valSet').textContent=formatF(payload);setTemp=parseFloat(payload)||0;}
  else if(topic.endsWith('/sensors/external_temperature')){$('#valAir').textContent=formatF(payload); latestTelemetry.air = Number(payload);}
  else if(topic.endsWith('/sensors/internal_temperature')){$('#valCtrl').textContent=formatF(payload); latestTelemetry.ctrl = Number(payload);}
  else if(topic.endsWith('/sensors/lux')){$('#valLux').textContent=formatLux(payload); latestTelemetry.lux = Number(payload);}
  else if(topic.endsWith('/sensors/mode_of_operation')){
    const v=parseInt(payload);modeState=isNaN(v)?0:v;$('#valMode').textContent=modeName(modeState);
    if(client && client.connected){updateFooterStatus();}
  }
  else if(topic.endsWith('/sensors/heater_status')){
    const val=parseInt(payload);flame.style.display=(val===1)?'inline-flex':'none';
    latestTelemetry.heater = (val===1)?1:0;
  }
  else if(topic.endsWith('/sensors/intelligent_mode')){
    aiMode=parseInt(payload)||0;
    if(client && client.connected){updateFooterStatus();}
  }
  else if(topic.endsWith('/sensors/intelligent_heat_rate')){
    const n=Number(payload);
    aiHeatRate=Number.isFinite(n)?n.toFixed(2)+' F/hr':payload;
    if(client && client.connected){updateFooterStatus();}
  }
  else if(topic.endsWith('/sensors/intelligent_rate_interpolated')){
    aiRateInterp=parseInt(payload)||0;
    if(client && client.connected){updateFooterStatus();}
  }
  else if(/\/sensors\/circuit_(\d+)_alias$/.test(topic)){
    const m=topic.match(/circuit_(\d+)_alias$/);const idx=Number(m[1]);
    circuitAliases.set(idx,payload.trim());recomputeGroups();
  }
  else if(/\/sensors\/circuit_(\d+)_power$/.test(topic)){
    const m=topic.match(/circuit_(\d+)_power$/);const idx=Number(m[1]);
    circuitPower.set(idx,Number(payload));
    if (idx >= 1 && idx <= 4) latestTelemetry.power[idx - 1] = Number(payload);
    for(const[alias,grp]of aliasGroups){if(grp.circuits.has(idx))updateButton(alias);}
  }
  else if(/\/sensors\/relay_(\d+)_status$/.test(topic)){
    const m=topic.match(/relay_(\d+)_status$/);const idx=Number(m[1]);
    circuitStatus.set(idx,Number(payload));
    if (idx >= 1 && idx <= 4) latestTelemetry.state[idx - 1] = Number(payload) > 0 ? 1 : 0;
    for(const[alias,grp]of aliasGroups){
      const before=grp.anyOn;
      grp.anyOn=[...grp.circuits].some(i=>(Number(circuitStatus.get(i))||0)===1);
      if(before!==grp.anyOn)updateButton(alias);
    }
  }
}
function connect(){
  if(!MAC){setFoot('No device id provided. Use the embedded install link.');return;}
  if(client){client.end(true);client=null;}
  setDot('#ffb84d');setFoot('Connecting…');
  try{
    client=mqtt.connect(MQTT_URL,MQTT_OPTS);
    client.on('connect',()=>{
      addHistogramEvent(hasConnectedOnce ? 'Reconnect' : 'Connected');
      hasConnectedOnce = true;
      setDot('#2cd186');
      updateFooterStatus('syncing...');
      client.subscribe(MAC+'/#');
      client.publish(MAC+'/control/read_alias','');
      client.publish(MAC+'/control/read_circuit_status','');
      client.publish(MAC+'/control/read_heater_status','');
      client.publish(MAC+'/control/read_intelligent_status','');
      client.publish(MAC+'/control/read_schedule','');
      fetchUptimeAndDetectReboot();
    });
    client.on('message',onMsg);
    client.on('close',()=>{addHistogramEvent('Disconnected');setDot('#7a8699');setFoot('Disconnected');scheduleReconnect();});
    client.on('error',e=>{setDot('#ff6b6b');setFoot('Error: '+(e?.message||'unknown'));client.end(true);scheduleReconnect();});
  }catch(e){setDot('#ff6b6b');setFoot('Connect exception: '+e.message);scheduleReconnect();}
}
function scheduleReconnect(){if(reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect();},5000);}

$('#btnUp').onclick=()=>{setTemp++;$('#valSet').textContent=setTemp.toFixed(1)+'°F';client?.publish(`${MAC}/control/set_temperature`,String(setTemp));};
$('#btnDown').onclick=()=>{setTemp--;$('#valSet').textContent=setTemp.toFixed(1)+'°F';client?.publish(`${MAC}/control/set_temperature`,String(setTemp));};

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(()=>{});});}
